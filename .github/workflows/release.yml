# Builds the Windows app on GitHub's servers — handy for forks that don't want to set up a build PC.
# Run it from the Actions tab ("Build Windows app" → "Run workflow"):
#  - leave "release_tag" empty to just build: download the zip from the run's "Artifacts"
#  - or enter an existing release tag (e.g. v1.1.0) to attach / replace the zip on that release
name: Build Windows app

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the zip to this existing release tag (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Build (bundles FFmpeg, Pandoc and Calibre)
        shell: pwsh
        run: ./build.ps1 -Zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: NeonConverter-windows
          path: dist/NeonConverter-windows.zip

      - name: Attach to release
        if: ${{ inputs.release_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/NeonConverter-windows.zip --clobber
